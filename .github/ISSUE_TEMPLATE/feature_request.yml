name: 💡 Feature or Theme Request
description: Suggest an idea, enhancement, or new corporate theme preset
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make these Agent skills better? We'd love to hear it!
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New Theme Preset
        - Visual / Presentation Enhancement
        - CLI / Script Feature
        - Documentation Improvement
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Feature Proposal
      description: Describe the solution you'd like to see.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: Why would this feature be useful to AI Agents or human users?
